    <!-- Proteção de valores monetários antes de enviar ao Supabase -->
    <script>
        (function () {
            function normalizeMoneyValue(value) {
                if (value === null || value === undefined || value === '') return 0;
                if (typeof value === 'number') return Number.isFinite(value) ? value : 0;

                var cleaned = String(value)
                    .replace(/R\$/gi, '')
                    .replace(/\s/g, '')
                    .replace(/[^0-9,.-]/g, '');

                if (!cleaned) return 0;

                var hasComma = cleaned.indexOf(',') !== -1;
                var hasDot = cleaned.indexOf('.') !== -1;

                if (hasComma && hasDot) {
                    cleaned = cleaned.replace(/\./g, '').replace(',', '.');
                } else if (hasComma) {
                    cleaned = cleaned.replace(',', '.');
                }

                var parsed = Number(cleaned);
                return Number.isFinite(parsed) ? parsed : 0;
            }

            function normalizePaidAmountInPayload(payload) {
                if (!payload || typeof payload !== 'object') return payload;

                if (Array.isArray(payload)) {
                    return payload.map(normalizePaidAmountInPayload);
                }

                var next = Object.assign({}, payload);
                if (Object.prototype.hasOwnProperty.call(next, 'paid_amount')) {
                    next.paid_amount = normalizeMoneyValue(next.paid_amount);
                }

                return next;
            }

            var originalFetch = window.fetch;
            window.fetch = function (input, init) {
                try {
                    var url = typeof input === 'string' ? input : (input && input.url) || '';
                    var method = (init && init.method ? init.method : '').toUpperCase();
                    var body = init && init.body;
                    var isSupabaseLeadWrite = url.indexOf('supabase.co') !== -1 && url.indexOf('/leads') !== -1 && ['POST', 'PATCH', 'PUT'].indexOf(method) !== -1;

                    if (isSupabaseLeadWrite && typeof body === 'string' && body.indexOf('paid_amount') !== -1) {
                        var parsedBody = JSON.parse(body);
                        var normalizedBody = normalizePaidAmountInPayload(parsedBody);
                        init = Object.assign({}, init, { body: JSON.stringify(normalizedBody) });
                    }
                } catch (error) {
                    console.warn('Falha ao normalizar paid_amount antes do envio:', error);
                }

                return originalFetch.apply(this, arguments.length > 1 ? [input, init] : [input]);
            };
        })();
    </script>

    <!-- Correção robusta: força assinatura/logo no PDF do certificado -->
    <script>
        (function () {
            const originalOpen = window.open;

            const certificatePdfPatch = `
<script>
(function () {
  function loadScript(src) {
    return new Promise(function(resolve, reject) {
      if (window.html2pdf) return resolve();
      var script = document.createElement('script');
      script.src = src;
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }

  function waitForImage(img) {
    img.setAttribute('crossorigin', 'anonymous');
    if (img.complete && img.naturalWidth > 0) return Promise.resolve();
    return new Promise(function(resolve) {
      img.onload = resolve;
      img.onerror = resolve;
      setTimeout(resolve, 15000);
    });
  }

  function blobToDataUrl(blob) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onloadend = function() { resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function inlineImage(img) {
    try {
      img.setAttribute('crossorigin', 'anonymous');
      if (!img.src || img.src.indexOf('data:') === 0) return;
      var response = await fetch(img.src, { mode: 'cors', cache: 'force-cache' });
      if (!response.ok) throw new Error('image fetch failed');
      var blob = await response.blob();
      var dataUrl = await blobToDataUrl(blob);
      img.src = dataUrl;
      await waitForImage(img);
    } catch (error) {
      console.warn('Não foi possível embutir imagem no certificado:', img.src, error);
      await waitForImage(img);
    }
  }

  async function prepareCertificateImages(element) {
    var images = Array.from(element.querySelectorAll('img'));
    for (var i = 0; i < images.length; i++) {
      await inlineImage(images[i]);
    }
  }

  window.downloadPDF = async function() {
    var element = document.querySelector('.certificate-wrapper');
    if (!element) {
      alert('Certificado não encontrado para baixar.');
      return;
    }

    var rawName = document.title.replace('Certificado - ', '').trim() || 'certificado';
    var fileName = 'Certificado_' + rawName.replace(/\\s+/g, '_') + '.pdf';

    try {
      await prepareCertificateImages(element);
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');

      var opt = {
        margin: 0,
        filename: fileName,
        image: { type: 'jpeg', quality: 1 },
        html2canvas: {
          scale: 2,
          useCORS: true,
          allowTaint: false,
          imageTimeout: 15000,
          logging: false,
          backgroundColor: '#ffffff'
        },
        jsPDF: { orientation: 'landscape', unit: 'px', format: [1122, 794], hotfixes: ['px_scaling'] }
      };

      await window.html2pdf().set(opt).from(element).save(fileName);
    } catch (error) {
      console.error('Erro ao gerar PDF com assinatura:', error);
      alert('Não consegui baixar automaticamente com a assinatura. Vou abrir a impressão para você salvar como PDF.');
      window.print();
    }
  };
})();
<\/script>`;

            window.open = function (...args) {
                const openedWindow = originalOpen.apply(window, args);

                try {
                    if (!openedWindow || !openedWindow.document || !openedWindow.document.write) {
                        return openedWindow;
                    }

                    const originalWrite = openedWindow.document.write.bind(openedWindow.document);

                    openedWindow.document.write = function (html) {
                        if (typeof html === 'string' && html.includes('certificate-wrapper')) {
                            html = html
                                .replace(/<img src=\"([^\"]+)\" class=\"signature-img\" \/>/g, '<img src="$1" class="signature-img" crossorigin="anonymous" />')
                                .replace(/<img src=\"([^\"]+)\" style=\"height: 80px; margin-bottom: 20px; object-fit: contain;\" \/>/g, '<img src="$1" style="height: 80px; margin-bottom: 20px; object-fit: contain;" crossorigin="anonymous" />')
                                .replace('</body>', certificatePdfPatch + '\n</body>');
                        }

                        return originalWrite(html);
                    };
                } catch (error) {
                    console.warn('Certificate PDF robust patch skipped:', error);
                }

                return openedWindow;
            };
        })();
    </script>
