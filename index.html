    <!-- Email fix: redireciona envios para a Edge Function correta -->
    <script>
        (function () {
            const SEND_EMAIL_URL = 'https://emdsgvuqrhpjdgrgaslo.supabase.co/functions/v1/send-ticket-email';

            function normalizeEmailPayload(payload) {
                payload = payload || {};
                const message = payload.html || payload.body || payload.message || payload.corpo || payload.content || '';
                return {
                    to: payload.to || payload.email || payload.recipient || payload.destinatario,
                    name: payload.name || payload.nome || '',
                    subject: payload.subject || payload.assunto || 'Mensagem Vox Marketing Academy',
                    productName: payload.productName || payload.produto || 'Vox Marketing Academy',
                    ticketUrl: payload.ticketUrl || payload.url || '',
                    certificateUrl: payload.certificateUrl || '',
                    message: typeof message === 'string' ? message : String(message || '')
                };
            }

            function isEmailRequest(url, method, body) {
                if (method !== 'POST' || !body || typeof body !== 'string') return false;
                if (String(url).includes('functions/v1/send-ticket-email')) return false;
                const u = String(url || '').toLowerCase();
                const b = body.toLowerCase();
                return u.includes('email') || u.includes('mail') ||
                    ((b.includes('"to"') || b.includes('"email"') || b.includes('destinatario')) &&
                    (b.includes('subject') || b.includes('assunto') || b.includes('message') || b.includes('html') || b.includes('corpo')));
            }

            const originalFetch = window.fetch;
            window.fetch = function (input, init) {
                try {
                    const url = typeof input === 'string' ? input : (input && input.url) || '';
                    const method = (init && init.method ? init.method : '').toUpperCase();
                    const body = init && init.body;
                    if (isEmailRequest(url, method, body)) {
                        input = SEND_EMAIL_URL;
                        init = Object.assign({}, init, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(normalizeEmailPayload(JSON.parse(body)))
                        });
                    }
                } catch (error) {
                    console.warn('Email interceptor skipped:', error);
                }
                return originalFetch.apply(this, arguments.length > 1 ? [input, init] : [input]);
            };
        })();
    </script>

    <!-- Correção: garante que o PDF do certificado capture assinatura/logo externas -->
    <script>
        (function () {
            const originalOpen = window.open;
            window.open = function (...args) {
                const openedWindow = originalOpen.apply(window, args);
                try {
                    if (!openedWindow || !openedWindow.document || !openedWindow.document.write) return openedWindow;
                    const originalWrite = openedWindow.document.write.bind(openedWindow.document);
                    openedWindow.document.write = function (html) {
                        if (typeof html === 'string' && html.includes('downloadPDF()') && html.includes('certificate-wrapper')) {
                            const waitForImagesScript = `
            function waitForCertificateImages(element) {
              const images = Array.from(element.querySelectorAll('img'));
              if (!images.length) return Promise.resolve();
              return Promise.all(images.map(function(img) {
                img.setAttribute('crossorigin', 'anonymous');
                if (img.complete && img.naturalWidth > 0) return Promise.resolve();
                return new Promise(function(resolve) {
                  img.onload = resolve;
                  img.onerror = resolve;
                  setTimeout(resolve, 15000);
                });
              }));
            }
`;
                            html = html
                                .replace(/<img src=\"([^\"]+)\" class=\"signature-img\" \/>/g, '<img src="$1" class="signature-img" crossorigin="anonymous" />')
                                .replace(/<img src=\"([^\"]+)\" style=\"height: 80px; margin-bottom: 20px; object-fit: contain;\" \/>/g, '<img src="$1" style="height: 80px; margin-bottom: 20px; object-fit: contain;" crossorigin="anonymous" />')
                                .replace('function downloadPDF() {', waitForImagesScript + '\n            function downloadPDF() {')
                                .replace('script.onload = function() {', 'script.onload = async function() {')
                                .replace('html2canvas: { scale: 2 },', 'html2canvas: { scale: 2, useCORS: true, allowTaint: false, imageTimeout: 15000 },')
                                .replace('try {\n                  const worker = html2pdf().set(opt);', 'try {\n                  await waitForCertificateImages(element);\n                  const worker = html2pdf().set(opt);');
                        }
                        return originalWrite(html);
                    };
                } catch (error) {
                    console.warn('Certificate PDF patch skipped:', error);
                }
                return openedWindow;
            };
        })();
    </script>

    <!-- Campo livre para nome da turma/curso na tela de certificados -->
    <script>
        (function () {
            const STORAGE_KEY = 'vox_certificate_custom_course_name';

            function findCourseSelect() {
                const labels = Array.from(document.querySelectorAll('label'));
                const label = labels.find(function (el) {
                    return (el.textContent || '').trim().toLowerCase().includes('selecione o treinamento');
                });
                if (!label) return null;
                const container = label.closest('.space-y-1') || label.parentElement;
                return container ? container.querySelector('select') : null;
            }

            function syncSelectWithCustomCourse(select, value) {
                if (!select || !value) return;
                let option = Array.from(select.options).find(function (opt) {
                    return opt.value === value;
                });
                if (!option) {
                    option = document.createElement('option');
                    option.value = value;
                    option.textContent = value;
                    option.setAttribute('data-custom-course', 'true');
                    select.appendChild(option);
                }
                select.value = value;
                select.dispatchEvent(new Event('change', { bubbles: true }));
            }

            function injectCustomCourseInput() {
                const select = findCourseSelect();
                if (!select || select.dataset.customCoursePatched === 'true') return;
                select.dataset.customCoursePatched = 'true';

                const wrapper = document.createElement('div');
                wrapper.className = 'space-y-1';
                wrapper.setAttribute('data-custom-course-wrapper', 'true');
                wrapper.innerHTML = `
                    <label class="text-sm font-black text-gray-700">Nome da Turma ou Curso no Certificado</label>
                    <input
                        type="text"
                        placeholder="Ex: IA Ads - Turma Julho / Google Meu Negócio Noturno"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-blue-500 font-bold"
                    />
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Esse nome será usado no texto do certificado e também no certificado em massa.</p>
                `;
                select.closest('.space-y-1').insertAdjacentElement('afterend', wrapper);

                const input = wrapper.querySelector('input');
                input.value = localStorage.getItem(STORAGE_KEY) || '';
                if (input.value.trim()) syncSelectWithCustomCourse(select, input.value.trim());

                input.addEventListener('input', function () {
                    const value = input.value.trim();
                    localStorage.setItem(STORAGE_KEY, value);
                    if (value) syncSelectWithCustomCourse(select, value);
                });

                select.addEventListener('change', function () {
                    if (select.value && select.value !== 'Personalizado') {
                        input.value = select.value;
                        localStorage.setItem(STORAGE_KEY, select.value);
                    }
                });
            }

            const observer = new MutationObserver(injectCustomCourseInput);
            document.addEventListener('DOMContentLoaded', function () {
                injectCustomCourseInput();
                observer.observe(document.body, { childList: true, subtree: true });
            });
        })();
    </script>
