name: Build APK 3.3.1

on:
  push:
    branches:
      - 3.3.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    if: contains(github.event.head_commit.message, '[apk-build]') == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: 3.3.1
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate web build
        run: |
          npx tsc --noEmit
          npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p APK_FINAL
          cp android/app/build/outputs/apk/debug/app-debug.apk APK_FINAL/checkoutvox-3.3.1.apk
          sha256sum APK_FINAL/checkoutvox-3.3.1.apk > APK_FINAL/checkoutvox-3.3.1.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkoutvox-3.3.1-apk
          path: |
            APK_FINAL/checkoutvox-3.3.1.apk
            APK_FINAL/checkoutvox-3.3.1.apk.sha256
          retention-days: 30

      - name: Save APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APK_FINAL/checkoutvox-3.3.1.apk APK_FINAL/checkoutvox-3.3.1.apk.sha256
          git commit -m "build: APK 3.3.1 [apk-build]" || exit 0
          git push origin HEAD:3.3.1
